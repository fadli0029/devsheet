name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Pinned so a Hugo release cannot break your site without you asking for it.
  HUGO_VERSION: "0.154.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # Supplies base_url, which is the repo's real Pages URL. Using it means the
      # build is correct whether Pages serves you from a user domain or a /repo/
      # subpath, with no edit to this file after forking.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Hugo resolves `theme = "devsheet"` to <themesDir>/devsheet, and the
      # checkout is named after the repo. Stage under a fixed name so a rename
      # or a differently-named fork still builds.
      - name: Stage theme
        run: |
          mkdir -p /tmp/themes
          cp -r "$GITHUB_WORKSPACE" /tmp/themes/devsheet

      # Publishes exampleSite, which is the theme's live demo.
      - name: Build
        run: |
          hugo --source exampleSite --themesDir /tmp/themes \
               --minify --gc \
               --baseURL "${{ steps.pages.outputs.base_url }}/" \
               --destination public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./exampleSite/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
